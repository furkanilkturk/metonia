name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: python3 scripts/validate.py
      - name: Check whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- .; then
            exit 1
          fi
